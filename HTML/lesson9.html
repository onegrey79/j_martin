      //ASYNC and AWAIT

      function step1() {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log("Step 1 completed");
            resolve();
          }, 3000);
        });
      }

      function step2() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            console.log("Step 2 completed");
            resolve();
          }, 3000);
        });
      }

      function step3() {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log("Step 3 completed");
            resolve();
          }, 3000);
        });
      }

      function step4() {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log("Step 4 completed");
            resolve();
          }, 3000);
        });
      }


      async function exceuteSteps(){
        await step1();
        await step2(); 
        await step3();
        await step4();
      }


      exceuteSteps();

      /*
            Primitive Data Tyoes 
             JavaScript has six primitive data types:

               1️⃣ String → Text values -> "Hello, Javascript 20 49"
               2️⃣ Number → Integer or floating-point numbers ->  100 
               3️⃣ Boolean → true or false
               4️⃣ Null → Represents an empty or non-existent value
               5️⃣ Undefined → A variable that has been declared but not assigned a value
               6️⃣ Symbol → Unique and immutable values (used for object properties)



               Variables (let, const, var)
               Variables store data that can be used and manipulated in a program. In JavaScript, we declare variables using let, const, or var.
               

                let → Block-scoped, can be reassigned.
                const → Block-scoped, cannot be reassigned.
                var → Function-scoped, outdated, use let or const instead.

                
                let firstName = "Allen";
                const age = 25;

                firstName = "Michael";
                age = 40;

                console.log(firstName);
                console.log(age);


                Basic Operators (+, -, *, /, %)
                Operators are used for performing mathematical and logical operations.

                let a = 10,b = 3;
                console.log("Addition:", a + b); // 13
                console.log("Subtraction:", a - b); // 7
                console.log("Multiplication:", a * b); // 30
                console.log("Division:", a / b); // 3.3333...
                console.log("Modulus (Remainder):", a % b); // 1


                String Concatenation (+ Operator)
                let firstName = "Allen";
                let lastName = "Smith";
                let fullName = firstName +" "+ lastName + "This is my fullname";
                console.log(fullName);

                Template Literals (Backticks ``)
                let name = "Bob";
                let age = 30;
                let message = `Hello, my name is ${name} and I am ${age} years old.`;

                console.log(message);

        */
    </script>

                Comparison Operators
                ==	Equal (loose comparison)	a == b	✅ true (Only compares values)
                ===	Strict equal	            a === b	❌ false (Compares both value and type)
                !=	Not equal	                a != b	❌ false (Only compares values)
                !==	Strict not equal	        a !== b	✅ true (Compares both value and type)
                >	Greater than	            a > 5	✅ true
                <	Less than	                a < 5	❌ false
                >=	Greater than or equal	    a >= 10	✅ true
                <=	Less than or equal	        a <= 5	❌ false


                let x = 15;

                !	NOT (reverses boolean value)	!(x > 5)	❌ false

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login page</title>
  
  <style>
     *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #192b7a 0%, #a2cae8 60%, #b8aee8 100%);
    }

    .login-card {








      
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      /* Orange top border accent */
      border-top: 10px solid #19389e;
    }

    .login-card h2 {
      text-align: center;
      color: #1609cf;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #666666;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dedede;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input::placeholder {
      color: #b0b0b0;
    }

    .form-group input:focus {
      border-color: #ff9400;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      /* Orange-to-pink gradient button */
      background: linear-gradient(to right, #0d4ba7, #ff4e6a);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }


  </style>
</head>
<body>

  <div class="login-card">
    <h2>Login</h2>
    <form action="" method="">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter email" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter password"
          required 
        />
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>
  </div>

</body>
</html>
